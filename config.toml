enable-module-update = true # set this to false if you do not want to receive updates for the module
parallel-jobs = 1

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/j-hc/revanced-magisk-module/blob/main/CONFIG.md for more detailed explanations

# you can use rvmm-config-gen to generate a config

[YouTube]
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"

version = "auto"
archive-dlurl = "https://dn790002.ca.archive.org/0/items/jhc-apks/apks/com.google.android.youtube/"

excluded-patches = "'Change header'"
patcher-args = "-e 'Custom branding' -OcustomName=YouTube -e 'Hide Shorts components' -OhideShortsAppShortcut=true -OhideShortsWidget=true -e 'Theme' -OlightThemeBackgroundColor=#E6E9EF"

[Music]
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"

version = "auto"
arch = "arm64-v8a"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"

excluded-patches = "'Change header'"
patcher-args = "-e 'Custom branding' -OcustomName='YT Music'"

# -- Replaces the previous icysymmetra-sourced TikTok section --
[TikTok]
patches-source = "SysAdminDoc/hushfeed"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"

pkg-name = "com.zhiliaoapp.musically"
version = "47.4.3"
arch = "arm64-v8a"
direct-dlurl = "https://github.com/H0ll0wrin/Revanced-Morphe-Obtainium/releases/download/apks/com.zhiliaoapp.musically-47.4.3-arm64-v8a.apk"

included-patches = "'AMOLED dark theme' 'Block P2P video relay' 'Hide Play Store update offer' 'Look like the store app' 'Remove content credential and card scanner assets' 'Remove creation tools' 'Remove unused language packs' 'Skip first-launch setup'"
patcher-args = "-e 'Accent color' -OaccentColor=#8B5CF6 -e 'Change app name' -OappName=TikTok"

[Pinterest]
patches-source = "SysAdminDoc/HushPinterest"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"

pkg-name = "com.pinterest"
version = "14.41.0"
arch = "arm64-v8a" # this patch bundle only targets arm64-v8a
direct-dlurl = "https://github.com/H0ll0wrin/Revanced-Morphe-Obtainium/releases/download/apks/com.pinterest-14.41.0-arm64-v8a.apk"

included-patches = "'Spoof signature for Google sign-in'"

[Shazam]
patches-source = "heval99/Heval-Morphe-Patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"

pkg-name = "com.shazam.android"
version = "16.63.0-261008"
arch = "arm64-v8a"
direct-dlurl = "https://github.com/H0ll0wrin/Revanced-Morphe-Obtainium/releases/download/apks/com.shazam.android-16.63.0-261008-arm64-v8a.apk"

included-patches = "'GmsCore support' 'Remove screenshot restriction'"

[IbisPaint X]
patches-source = "hoo-dles/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"

pkg-name = "jp.ne.ibis.ibispaintx.app"
version = "14.1.0"
arch = "arm64-v8a" # required by 'Enable Prime membership', which is on by default
direct-dlurl = "https://github.com/H0ll0wrin/Revanced-Morphe-Obtainium/releases/download/apks/jp.ne.ibis.ibispaintx.app-14.1.0-arm64-v8a.apk"
